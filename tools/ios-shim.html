<!-- iOS-only shim. Appended to the Capacitor index.html by `npm run ios:web`.
     NEVER injected into the Android app.html — keeps the Android build untouched. -->
<style>
/* Android sets --zk-sat/sab/sal/sar natively via WindowInsets; on iOS map them to
   the platform's env() safe-area insets so the header clears the status bar and the
   bottom nav clears the home indicator. viewport-fit=cover is already set in <head>. */
#zk-root{
  --zk-sat:env(safe-area-inset-top);
  --zk-sab:env(safe-area-inset-bottom);
  --zk-sal:env(safe-area-inset-left);
  --zk-sar:env(safe-area-inset-right);
}
</style>
<script>
/* The themed --color-bg lives on .zk-app, not on <body>, so the WKWebView safe-area
   strips (behind the status bar / home indicator) would show through as white.
   Mirror the active theme's background onto <html>/<body> so those strips blend in.
   ponytail: 600ms poll — theme changes are rare; swap for a MutationObserver only if
   it ever shows a visible lag. */
(function(){
  function sync(){
    var el=document.querySelector('.zk-app')||document.getElementById('zk-root');
    if(!el)return;
    var bg=getComputedStyle(el).backgroundColor;
    if(bg && bg!=='rgba(0, 0, 0, 0)'){
      document.documentElement.style.background=bg;
      document.body.style.background=bg;
    }
  }
  setInterval(sync,600); setTimeout(sync,300);
})();
</script>
<script>
/* navigator.vibrate is a no-op in iOS WKWebView (no Vibration API), so route haptics
   through @capacitor/haptics. On Android this path is unused — its native bridge
   overrides navigator.vibrate first (ZikirNative exists), so this override never runs.
   The web app calls vibrate([70]) per tap and multi-element patterns on milestones. */
navigator.vibrate=function(p){
  var H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;
  if(!H)return true;
  var arr=Array.isArray(p)?p:[p];
  try{
    if(arr.length<=1) H.impact({style:'MEDIUM'});
    else H.notification({type:'SUCCESS'});
  }catch(e){}
  return true;
};
</script>
<script>
/* Reminders. Android mirrors the web reminder list into daily AlarmManager alarms;
   on iOS mirror them into @capacitor/local-notifications with a native daily-repeating
   trigger. Text is baked at schedule time from the in-app language (matching Android's
   "Zikir vakti" / "Time for dhikr"). Re-syncs only when the reminder set changes. */
(function(){
  var KEY='zikirci-v1', BASE=1000, lastSig='', asked=false;
  var I18N={
    tr:['Zikir vakti','Zikrine devam etmek ister misin?'],
    en:['Time for dhikr','Would you like to continue your dhikr?'],
    ar:['وقت الذِّكر','هل تريد متابعة ذِكرك؟'],
    id:['Waktunya berzikir','Ingin melanjutkan zikirmu?'],
    hi:['ज़िक्र का समय','क्या आप अपना ज़िक्र जारी रखना चाहेंगे?'],
    zh:['记念时间','要继续你的记念吗？']
  };
  function LN(){ return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications; }
  function read(){
    try{ var s=JSON.parse(localStorage.getItem(KEY)||'{}');
      return {lang:s.lang||'tr', list:(s.reminders||[]).filter(function(r){return r&&r.on&&r.time;})};
    }catch(e){ return {lang:'tr',list:[]}; }
  }
  async function reconcile(){
    var ln=LN(); if(!ln) return;
    var st=read(), sig=JSON.stringify(st);
    if(sig===lastSig) return;          // nothing changed
    lastSig=sig;
    // cancel our previous set (ids BASE..BASE+999)
    try{ var pend=await ln.getPending();
      var ours=(pend.notifications||[]).filter(function(n){return n.id>=BASE&&n.id<BASE+1000;});
      if(ours.length) await ln.cancel({notifications:ours.map(function(n){return {id:n.id};})});
    }catch(e){}
    if(!st.list.length) return;        // no enabled reminders → no prompt, nothing to schedule
    if(!asked){ asked=true; try{ await ln.requestPermissions(); }catch(e){} }
    var t=I18N[st.lang]||I18N.en;
    var notifs=st.list.map(function(r,i){
      var hm=String(r.time).split(':');
      return { id:BASE+i, title:t[0],
        body:(r.label&&String(r.label).trim())?String(r.label):t[1],
        schedule:{ on:{hour:parseInt(hm[0],10),minute:parseInt(hm[1],10)}, allowWhileIdle:true, repeats:true } };
    }).filter(function(n){return !isNaN(n.schedule.on.hour)&&!isNaN(n.schedule.on.minute);});
    if(notifs.length){ try{ await ln.schedule({notifications:notifs}); }catch(e){} }
  }
  setInterval(reconcile,1500); setTimeout(reconcile,1200);
})();
</script>
