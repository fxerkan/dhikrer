name: Release

# Push a semver tag (e.g. v1.3.1) to build + deploy both platforms.
# Or run manually from the Actions tab (workflow_dispatch) to build without a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to the stores? Off = build + sign + artifact only (dry run)."
        type: boolean
        default: false

# Tag pushes always publish; manual runs publish only when the box is ticked.
env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  # ---------------------------------------------------------------------------
  # Android → Google Play (Internal testing track by default)
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No web-asset generation here: the WebView loads the committed
      # android/app/src/main/assets/app/ directly. gen_app.mjs regenerates those
      # from webapp-handoff/ (gitignored design source) and is a local dev step —
      # run it before committing when the UI changes, not in CI.

      # Decode the signing keystore + write keystore.properties (both gitignored in the repo).
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/zikirci-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=zikirci-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease
        working-directory: android

      # Upload to Play. Change `track` to `production` for a full release,
      # or `alpha`/`beta` for the closed/open testing tracks.
      - name: Upload to Google Play
        if: env.PUBLISH == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fxerkan.dhikrer
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: dhikrer-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  # ---------------------------------------------------------------------------
  # iOS → App Store Connect (TestFlight / App Store)
  # ---------------------------------------------------------------------------
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor CLI deps
        run: npm ci

      # Build www/ from the committed android assets, then sync into ios/App/App/public.
      # (No gen_app.mjs — see the android job; committed assets are the source of truth.)
      - name: Build web assets + sync iOS
        run: |
          npm run ios:web
          npx cap sync ios

      # Import the distribution cert + provisioning profile into a temp keychain.
      # Manual signing (not Xcode cloud signing — see docs/ios.md / memory notes).
      - name: Import signing assets
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$DIST_CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/dhikrer.mobileprovision

      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROFILE_NAME }}" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.fxerkan.dhikrer</key><string>${{ secrets.IOS_PROFILE_NAME }}</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # Upload with an App Store Connect API key (JSON not needed — 3 fields).
      - name: Upload to App Store Connect
        if: env.PUBLISH == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: dhikrer-ios-ipa
          path: ${{ runner.temp }}/export/App.ipa
